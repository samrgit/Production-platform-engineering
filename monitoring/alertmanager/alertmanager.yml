global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# This receiver intentionally sends no external notifications. It keeps the
# initial integration safe while exposing alerts in Alertmanager's UI. Add a
# production notification integration (email, Slack, PagerDuty, etc.) later.
receivers:
  - name: default
